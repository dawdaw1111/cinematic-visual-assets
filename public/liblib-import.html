<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>项目导入</title>
<style>
  body{margin:0;padding:32px;background:#0c0e14;color:#eef1f7;font:14px/1.5 system-ui}
  main{max-width:760px;margin:auto}textarea{width:100%;height:320px;box-sizing:border-box;padding:14px;border:1px solid #303543;border-radius:12px;background:#151924;color:#dfe5f0}
  button{margin-top:14px;padding:12px 20px;border:0;border-radius:10px;background:#8b5cf6;color:white;font-weight:700}output{display:block;margin-top:14px;color:#a7f3d0}
</style>
<main><h1>项目数据导入</h1><textarea id="payload" aria-label="项目 JSON"></textarea><button id="save">导入项目</button><output id="status"></output></main>
<script>
  const payloadField = document.querySelector('#payload');
  const saveButton = document.querySelector('#save');
  const statusOutput = document.querySelector('#status');
  saveButton.addEventListener('click', async () => {
    statusOutput.textContent = '正在导入…';
    const response = await fetch('/__pb/api/liblib-import', {method:'POST',headers:{'Content-Type':'application/json'},body:payloadField.value});
    const result = await response.json();
    statusOutput.textContent = response.ok ? `已导入 ${result.saved} 个内容节点` : `导入失败：${result.message}`;
  });
</script>
</html>
